name: Test Qubit Computer / QubitOS

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[test]"
      - name: Unit tests (APQB math, hardware, QBNN, QubitOS)
        run: python -m pytest -q
      - name: Boot QubitOS and run the demo script
        run: |
          qubitos examples/demo.qsh --quiet --seed 1
          qubitos -c "run grover 1011 --seed 0; ent last" --quiet
