[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "qubit-computer"
version = "0.1.0"
description = "Qubit Computer: a quantum computer whose qubits are APQBs (Adjustable Pseudo Quantum Bits), with QubitOS on top"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "tapiocaTakeshi" }]
keywords = ["quantum", "qubit", "apqb", "qbnn", "simulator", "operating-system", "qubit-ai"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering :: Physics",
  "Topic :: System :: Operating System",
]
dependencies = []

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
qubitos = "qubit_computer.os.boot:main"
qubit-computer = "qubit_computer.os.boot:main"

[project.urls]
Homepage = "https://github.com/tapiocaTakeshi/Qubit-Computer"
"Qubit AI (APQB / QBNN)" = "https://github.com/tapiocaTakeshi/Qubit"

[tool.setuptools.packages.find]
include = ["qubit_computer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
